<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        div {
            width: 200px;
            height: 200px;

            text-align: center;

            display: inline-block;
            border: 1px solid black;
            background-color: lightcoral;
        }
        div > p {
            display: none;
        }
        div:hover > p{
            display: block;
        }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
    <div class="dhover">
        Passe o mouse aqui.
        <p>TESTO ESCONDIDO!!!</p>
    </div>
</body>
</html>
