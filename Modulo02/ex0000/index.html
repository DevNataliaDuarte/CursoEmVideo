<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentando fazer um menu</title>
    <style>
        @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css");

        * {
            padding: 0;
            margin: 0;
        }
        header {
            width: 100vw;
            height: 200px;

            background-color: azure;
        }
        menu {
            width: 100vw;
            height: 40px;
            
            background-color: rgb(149, 149, 255);
        }
        menu > ul > li {
            display: none;
        }
        menu > p {
            cursor: pointer;

        }
        i {
            cursor: pointer;
            font-size: 30px;
            color: black;
            padding: 10px;
            margin: 0 10px;
        }
        a {
            color: black;
            text-decoration: none;
        }

        menu:hover > ul > li{
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <menu>
            <i class="bi bi-water"></i>
            <ul>
                <li><a href="#infos">Infos</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </menu>
    </header>
</body>
</html>
