<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 02</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: separate;
        }

        td {
            text-align: center;
            border: 1px solid black;
        }
        td#gordo {
            padding: 10px;
            background-color: rgba(247, 56, 56, 0.404);
        }
        td#fino {
            background-color: rgba(64, 64, 253, 0.404);
        }
    </style>
</head>
<body>
    <h1>Tabela 02</h1>
    <table>
        <tr>
            <td class="mod" id="fino" colspan="4">A</td>
            <td class="mod" id="gordo" rowspan="4">B</td>
        </tr>
        <tr>
            <td class="mod" id="gordo" rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        <tr>
            <td class="mod" id="fino" colspan="4">N</td>
        </tr>
    </table>
</body>
</html>
