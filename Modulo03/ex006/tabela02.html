<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        caption {
            padding: 10px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: lightgray;
        }
        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        thead, tfoot {
            color: white;
            background-color: gray;
        }
        .num {
            text-align: right;
        }
    </style>
    <title>Tabela Grande</title>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <!--Legenda da Tabela-->
        <caption>População das Unidades Federativas</caption>
        <thead>
            <th scope="col">Estado</th>
            <th scope="col" style=" width: 50px;">População</th>
        </thead>
        <tbody>
            <tr>
                <td>Distrito Federal</td>
                <td class="num">2.923.369</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="num">46.024.937</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">16.615.526</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row">Total de Habitantes</th>
            <td class="num">0.000.000</td>
        </tfoot>
    </table>
</body>
</html>
