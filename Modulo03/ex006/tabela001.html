<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            text-align: center; /* Alinhamento horizontal*/
            border-collapse: collapse;
        }
        tr.linha {
            background-color: rgba(128, 128, 128, 0.712);
        }
        td {
            padding: 5px;
            vertical-align: bottom; /* Alinhamento Vertical */
            border: 1px solid black;
        }
        .numero {
            text-align: right;
        }
    </style>
    <title>Tabela em HTML</title>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr class="linha">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
