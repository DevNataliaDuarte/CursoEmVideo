<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando Listas</title>
    <style>
        div{
            width: 300px;
            height: 50px;
            align-items: center;
            justify-content: center;

            background-color: rgb(119, 119, 209);
        }
        ol{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            text-align: center;
        }
        li{
            
            align-items: center;
            list-style: none;
        }
    </style>
</head>
<body>
    <h1>Treino de Listas</h1>
    <div>
        <ol>
            <li>Menu</li>
            <li>Contato</li>
            <li>Sobre</li>
            <li>Parceiros</li>
        </ol>
    </div>
</body>
</html>
